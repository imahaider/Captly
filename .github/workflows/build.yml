name: build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Captly.slnx
      - run: dotnet build Captly.slnx -c Release --no-restore

      # Failing tests become annotations, so they show on the run's summary page.
      - name: Test
        shell: pwsh
        run: |
          $out = @(dotnet test --solution Captly.slnx -c Release --no-build 2>&1 | ForEach-Object { "$_" -replace '\x1b\[[0-9;]*m', '' })
          $code = $LASTEXITCODE
          $out | Write-Output
          # One annotation per failed test: its name, then the lines that say why.
          for ($i = 0; $i -lt $out.Count; $i++) {
              if ($out[$i] -notmatch '^\s*failed ') { continue }
              $detail = ($out[$i..([Math]::Min($i + 6, $out.Count - 1))] | ForEach-Object { $_.Trim() }) -join ' | '
              Write-Output "::error::$detail"
          }
          exit $code
