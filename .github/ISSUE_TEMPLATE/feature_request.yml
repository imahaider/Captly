name: Feature idea
description: Suggest something Captly could do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Captly help?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Other apps that do it well, screenshots, or links.
